<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🎵 双人合奏 · 节奏救援</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#080818;color:#fff;
font-family:'Segoe UI',sans-serif;touch-action:none;user-select:none;position:fixed;top:0;left:0;right:0;bottom:0;}
.app{width:100vw;height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.lobby{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;
justify-content:center;align-items:center;padding:20px;z-index:20;
background:radial-gradient(ellipse at 50% 30%,#12122a,#080818);
transition:opacity .4s,transform .4s;}
.lobby.hidden{opacity:0;pointer-events:none;transform:scale(.95);}
.lobby-title{font-size:26px;font-weight:800;letter-spacing:2px;margin-bottom:2px;
background:linear-gradient(135deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#a855f7);
background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
animation:grad 4s ease infinite;}
@keyframes grad{0%{background-position:0}50%{background-position:100%}100%{background-position:0}}
.lobby-sub{color:#666;font-size:11px;margin-bottom:18px;}
.lobby-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
border-radius:14px;padding:16px 20px;width:100%;max-width:340px;}
.lobby-row{display:flex;gap:8px;margin-bottom:10px;}
.lobby-input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);
background:rgba(255,255,255,.04);color:#fff;font-size:16px;text-align:center;
outline:none;letter-spacing:4px;font-weight:600;}
.lobby-input:focus{border-color:#4d96ff;}
.lobby-btn{padding:10px 18px;border:none;border-radius:8px;font-size:13px;font-weight:600;
cursor:pointer;min-width:72px;white-space:nowrap;}
.lobby-btn:active{opacity:.7;}
.lobby-btn.pri{background:linear-gradient(135deg,#4d96ff,#6bcb77);color:#fff;}
.lobby-btn.dan{background:linear-gradient(135deg,#ff6b6b,#ffd93d);color:#1a1a3a;}
.lobby-btn.sec{background:rgba(255,255,255,.06);color:#888;border:1px solid rgba(255,255,255,.06);}
.lobby-btn.small{padding:6px 12px;font-size:11px;min-width:auto;}
.diff-group{display:flex;gap:5px;margin-bottom:10px;}
.diff-btn{flex:1;padding:7px;border-radius:8px;border:1px solid rgba(255,255,255,.06);
background:rgba(255,255,255,.04);color:#666;font-size:11px;font-weight:600;
cursor:pointer;text-align:center;}
.diff-btn.act{background:rgba(255,217,61,.1);border-color:rgba(255,217,61,.3);color:#ffd93d;}
.lobby-status{font-size:11px;color:#555;min-height:18px;margin-top:6px;text-align:center;}
.code-area{display:none;margin-top:10px;}
.code-area.show{display:block;}
.steps{display:flex;gap:4px;margin-bottom:6px;justify-content:center;}
.step{font-size:9px;padding:3px 6px;border-radius:4px;background:rgba(255,255,255,.03);color:#444;}
.step.on{background:rgba(77,150,255,.15);color:#4d96ff;}
.step.ok{background:rgba(107,203,119,.15);color:#6bcb77;}
.ca-hint{font-size:10px;color:#ffd93d;margin-bottom:4px;text-align:center;}
.code-box textarea{width:100%;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.03);color:#aaa;font-size:9px;font-family:monospace;resize:none;
outline:none;word-break:break-all;line-height:1.4;height:48px;}
.code-btns{display:flex;gap:4px;margin-top:4px;}
.code-btns button{flex:1;padding:6px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;}
.code-btns .cpy{background:rgba(255,217,61,.1);color:#ffd93d;}
.code-btns .cnf{background:rgba(107,203,119,.1);color:#6bcb77;display:none;}
.game-area{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;}
.game-area.show{display:flex;}
.top-bar{display:flex;justify-content:space-between;align-items:center;
padding:3px 10px;height:32px;flex-shrink:0;background:rgba(0,0,0,.3);z-index:5;}
.tb-p1,.tb-p2{font-size:11px;}
.tb-p1{text-align:left;color:#4d96ff;}
.tb-p2{text-align:right;color:#ff6b6b;}
.tb-center{text-align:center;color:#ffd93d;font-size:10px;font-weight:600;letter-spacing:1px;}
.tb-score{font-size:16px;font-weight:700;}
.tb-combo{font-size:8px;opacity:.4;display:block;}
.tb-combo.fire{opacity:1;color:#ffd93d;text-shadow:0 0 8px #ffd93d;}
.tb-rescue{font-size:8px;color:#ffd93d;opacity:0;transition:opacity .3s;}
.tb-rescue.show{opacity:.6;}
.canvas-wrap{flex:1;position:relative;overflow:hidden;}
#gc{width:100%;height:100%;display:block;background:#080818;}
.touch-zones{position:absolute;bottom:0;left:0;right:0;height:28%;z-index:10;}
.tz-row{display:flex;height:100%;width:100%;}
.tz-half{width:50%;display:flex;}
.tz-lane{flex:1;border-left:1px solid rgba(255,255,255,.04);cursor:pointer;position:relative;}
.tz-lane:first-child{border-left:none;}
.tz-lane.ap1{background:rgba(77,150,255,.15);}
.tz-lane.ap2{background:rgba(255,107,107,.15);}
.tz-lbl{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
font-size:10px;font-weight:700;opacity:.18;pointer-events:none;}
.p1tz .tz-lbl{color:#4d96ff;}
.p2tz .tz-lbl{color:#ff6b6b;}
.result{position:absolute;top:0;left:0;right:0;bottom:0;display:none;
flex-direction:column;justify-content:center;align-items:center;
background:rgba(8,8,24,.96);z-index:25;padding:20px;backdrop-filter:blur(10px);}
.result.show{display:flex;}
.res-grade{font-size:48px;margin-bottom:3px;}
.res-title{font-size:20px;font-weight:700;margin-bottom:2px;}
.res-sub{font-size:12px;color:#777;margin-bottom:16px;}
.res-grid{display:flex;gap:16px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
.res-item{text-align:center;min-width:60px;}
.res-val{font-size:22px;font-weight:700;}
.res-lbl{font-size:9px;color:#555;margin-top:2px;}
.res-detail{font-size:11px;color:#555;line-height:1.6;margin-bottom:14px;text-align:center;}
.result .btn-row{display:flex;gap:8px;}
</style>
</head>
<body>
<div class="app">
<div class="lobby" id="lobby">
  <div class="lobby-title">🎵 双人合奏</div>
  <div class="lobby-sub">互相救场 · 合作通关</div>
  <div class="lobby-card">
    <div class="lobby-row">
      <input class="lobby-input" id="roomInput" placeholder="房间号 / 粘贴码">
    </div>
    <div class="lobby-row">
      <button class="lobby-btn pri" id="createBtn">🏠 创建房间</button>
      <button class="lobby-btn dan" id="joinBtn">🔗 加入房间</button>
    </div>
    <div class="diff-group" id="diffGroup">
      <div class="diff-btn" data-d="easy">🌱 简单</div>
      <div class="diff-btn act" data-d="normal">🔥 普通</div>
      <div class="diff-btn" data-d="hard">💀 困难</div>
    </div>
    <div class="lobby-status" id="lobbyStatus">选择难度，创建或加入房间</div>
    <div class="code-area" id="codeArea">
      <div class="steps" id="steps">
        <span class="step" id="st1">① 复制</span>
        <span class="step" id="st2">② 等待</span>
        <span class="step" id="st3">③ 确认</span>
      </div>
      <div class="ca-hint" id="caHint">📋 复制下面的连接码发给好友</div>
      <div class="code-box"><textarea id="codeText" readonly></textarea></div>
      <div class="code-btns">
        <button class="cpy" id="copyBtn">📋 复制</button>
        <button class="cnf" id="confirmBtn">✅ 确认连接</button>
      </div>
    </div>
  </div>
</div>

<div class="game-area" id="gameArea">
  <div class="top-bar">
    <div class="tb-p1">🟦 <span class="tb-score" id="s1">0</span>
      <span class="tb-combo" id="c1">COMBO 0</span>
      <span class="tb-rescue" id="r1">⚡救援!</span>
    </div>
    <div class="tb-center"><span id="statusLabel">🎵 准备</span></div>
    <div class="tb-p2"><span class="tb-rescue" id="r2">⚡救援!</span>
      <span class="tb-combo" id="c2">COMBO 0</span>
      <span class="tb-score" id="s2">0</span> 🟥</div>
  </div>
  <div class="canvas-wrap">
    <canvas id="gc"></canvas>
    <div class="touch-zones" id="touchZones"></div>
  </div>
</div>

<div class="result" id="resultPanel">
  <div class="res-grade" id="resGrade">🎉</div>
  <div class="res-title" id="resTitle">完美通关</div>
  <div class="res-sub" id="resSub">合作愉快！</div>
  <div class="res-grid">
    <div class="res-item"><div class="res-val" id="resScore">0</div><div class="res-lbl">总得分</div></div>
    <div class="res-item"><div class="res-val" id="resAcc">100%</div><div class="res-lbl">精准度</div></div>
    <div class="res-item"><div class="res-val" id="resCombo">0</div><div class="res-lbl">最大连击</div></div>
  </div>
  <div class="res-detail" id="resDetail"></div>
  <div class="btn-row">
    <button class="lobby-btn sec" id="resReplay">🔄 再来</button>
    <button class="lobby-btn sec" id="resMenu">🏠 菜单</button>
  </div>
</div>
</div>

<script>
"use strict";
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};

// ===== Game state =====
let pc=null,dc=null,isHost=false,amHost=false,waitingAnswer=false;
let p1,p2,allNotes=[],resQ=[],frame=0,running=false,mySide=null,partner=null;
let diff='normal',seed=0;
let totals={p1:0,p2:0},rescued={p1:0,p2:0},missed={p1:0,p2:0};
let perf={p1:0,p2:0},hits={p1:0,p2:0};
let actx=null; let W,H,hitY=0;

// ===== Canvas =====
const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
function resize(){
  const p=cv.parentElement; if(!p)return;
  const r=p.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
  W=cv.width; H=cv.height; hitY=H*0.78;
}
window.addEventListener('resize',resize);

// ===== Helper =====
function $(id){return document.getElementById(id);}
function status(t){$('lobbyStatus').textContent=t;}
function hint(t){$('caHint').textContent=t;}
function stepShow(n){
  for(let i=1;i<=3;i++){
    const el=$('st'+i);
    el.className='step'+(i===n?' on':'')+(i<n?' ok':'');
  }
}

// ===== Touch zones setup =====
function setupTZ(){
  const tz=$('touchZones');
  if(tz.children.length>0)return;
  const P1K=['a','s','d','f'],P2K=['j','k','l',';'];
  const C1=['#4d96ff','#6bcb77','#ffd93d','#ff8844'];
  const C2=['#ff6b6b','#ff8844','#ffd93d','#6bcb77'];
  const row=document.createElement('div');row.className='tz-row';
  [P1K,P2K].forEach((keys,hi)=>{
    const half=document.createElement('div');half.className=`tz-half ${hi===0?'p1tz':'p2tz'}`;
    keys.forEach((k,li)=>{
      const lane=document.createElement('div');lane.className='tz-lane';
      lane.dataset.side=hi===0?'p1':'p2'; lane.dataset.lane=li;
      const lbl=document.createElement('span');lbl.className='tz-lbl';lbl.textContent=k.toUpperCase();
      lane.appendChild(lbl); half.appendChild(lane);
    });
    row.appendChild(half);
  });
  tz.appendChild(row);
  
  // Bind events
  tz.querySelectorAll('.tz-lane').forEach(el=>{
    el.addEventListener('touchstart',e=>{e.preventDefault(); onTap(el.dataset.side,parseInt(el.dataset.lane));});
    el.addEventListener('mousedown',e=>{e.preventDefault(); onTap(el.dataset.side,parseInt(el.dataset.lane));});
  });
}

function onTap(side,lane){
  if(!running||side!==mySide)return;
  const n=allNotes.find(x=>!x.hit&&!x.missed&&x.lane===lane&&x.y>=hitY-20&&x.y<=hitY+20);
  if(n){n.hit=true; hits[side]++; p1.score+=10; tn(660,side==='p1'?'sine':'triangle');}
}

// ===== Audio =====
function aI(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();}
function tn(f,t='sine',d=.2,v=.08){
  try{aI();const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);o.type=t;
  o.frequency.setValueAtTime(f,actx.currentTime);
  g.gain.setValueAtTime(v,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
  o.start();o.stop(actx.currentTime+d);}catch(e){}
}

// ===== WebRTC: create room (host) =====
async function createRoom(){
  status('⏳ 初始化...');
  try{
    pc=new RTCPeerConnection(ICE);
    dc=pc.createDataChannel('game');
    dc.onopen=()=>{ status('✅ 已连接！'); onConnect(); };
    dc.onmessage=e=>{ try{ onMsg(JSON.parse(e.data)); }catch(ex){} };
    
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    await new Promise(r=>{
      if(pc.iceGatheringState==='complete') r();
      else pc.onicegatheringstatechange=()=>{ if(pc.iceGatheringState==='complete') r(); };
    });
    
    const code=btoa(JSON.stringify(pc.localDescription));
    $('codeArea').classList.add('show');
    stepShow(1);
    $('codeText').value=code;
    $('copyBtn').textContent='📋 复制';
    $('confirmBtn').style.display='none';
    hint('📋 复制下方连接码，发给好友');
    status('步骤①：复制连接码 → 发给好友');
    waitingAnswer=true;
    isHost=true; amHost=true;
  }catch(e){
    status('❌ 创建失败: '+e.message);
    console.error('createRoom error:',e);
  }
}

// ===== WebRTC: join room (guest) =====
async function joinRoom(){
  const input=$('roomInput').value.trim();
  if(waitingAnswer && input.length>50){
    confirmAnswer(); return;
  }
  if(!input){ status('⚠️ 请粘贴好友的连接码'); return; }
  status('⏳ 连接中...');
  try{
    const offer=JSON.parse(atob(input));
    pc=new RTCPeerConnection(ICE);
    pc.ondatachannel=e=>{
      dc=e.channel;
      dc.onopen=()=>{ status('✅ 已连接！'); onConnect(); };
      dc.onmessage=ev=>{ try{ onMsg(JSON.parse(ev.data)); }catch(ex){} };
    };
    await pc.setRemoteDescription(offer);
    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await new Promise(r=>{
      if(pc.iceGatheringState==='complete') r();
      else pc.onicegatheringstatechange=()=>{ if(pc.iceGatheringState==='complete') r(); };
    });
    
    const code=btoa(JSON.stringify(pc.localDescription));
    $('codeArea').classList.add('show');
    stepShow(1);
    $('codeText').value=code;
    $('copyBtn').textContent='📋 复制';
    $('confirmBtn').style.display='none';
    hint('📋 复制下方回应码，发回给好友');
    status('步骤②：复制回应码 → 发回给好友');
    isHost=false; amHost=false;
  }catch(e){
    status('❌ 连接失败: '+e.message);
    console.error('joinRoom error:',e);
  }
}

// ===== Host confirms answer from guest =====
async function confirmAnswer(){
  const input=$('roomInput').value.trim();
  if(!input){ status('⚠️ 请粘贴好友发回的回应码'); return; }
  $('confirmBtn').textContent='⏳ 连接中...';
  try{
    const answer=JSON.parse(atob(input));
    await pc.setRemoteDescription(answer);
    status('✅ 连接建立中...');
    stepShow(3);
  }catch(e){
    status('❌ 回应码无效: '+e.message);
    $('confirmBtn').textContent='✅ 确认连接';
    console.error('confirmAnswer error:',e);
  }
}

// ===== On WebRTC connected =====
function onConnect(){
  mySide=amHost?'p1':'p2';
  partner=mySide==='p1'?'p2':'p1';
  $('codeArea').classList.remove('show');
  $('lobby').classList.add('hidden');
  $('gameArea').classList.add('show');
  setTimeout(resize,50);
  setupTZ();
  if(amHost){
    seed=Math.floor(Math.random()*999999)+1;
    dc.send(JSON.stringify({type:'start',seed,diff}));
    initGame();
  }
}

// ===== Message handler =====
function onMsg(msg){
  if(msg.type==='start'){
    seed=msg.seed; diff=msg.diff;
    initGame();
  }
}

// ===== Game logic =====
class Note{
  constructor(lane,timing){ this.lane=lane; this.timing=timing; this.y=-30; this.hit=false; this.missed=false; }
}

function initGame(){
  allNotes=[]; resQ=[]; frame=0; running=true;
  p1={score:0,combo:0}; p2={score:0,combo:0};
  rescued={p1:0,p2:0}; missed={p1:0,p2:0}; hits={p1:0,p2:0}; perf={p1:0,p2:0};
  // Simple note generation
  const speed={easy:60,normal:45,hard:30}[diff]||45;
  for(let i=0;i<50;i++){
    const lane=Math.floor(Math.random()*4);
    const timing=i*speed+Math.random()*20;
    allNotes.push(new Note(lane,timing));
  }
  totals.p1=allNotes.length; totals.p2=allNotes.length;
}

function checkMiss(){
  for(const n of allNotes){
    if(!n.hit&&!n.missed&&n.y>hitY+30){
      n.missed=true; missed[mySide]++; p1.combo=0; tn(220,'square',.08);
    }
  }
}

function updateNotes(){
  frame++;
  const speed={easy:.8,normal:1,hard:1.3}[diff]||1;
  for(const n of allNotes){
    if(!n.hit&&!n.missed){
      n.y+=speed;
      if(n.y<-20&&n.timing<frame)n.y=-20;
    }
  }
  checkMiss();
}

let animId=null;
function loop(){
  ctx.clearRect(0,0,W,H);
  if(running){
    updateNotes();
    ctx.fillStyle='#080818'; ctx.fillRect(0,0,W,H);
    // Draw lanes
    const lw=W/4;
    for(let i=0;i<4;i++){
      ctx.strokeStyle='rgba(255,255,255,.02)';
      ctx.beginPath(); ctx.moveTo(i*lw,0); ctx.lineTo(i*lw,H); ctx.stroke();
    }
    // Draw hit line
    ctx.strokeStyle='rgba(255,217,61,.3)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,hitY); ctx.lineTo(W,hitY); ctx.stroke();
    // Draw notes
    for(const n of allNotes){
      if(n.hit||n.missed||n.y<-20)continue;
      const x=n.lane*lw+lw/2;
      ctx.fillStyle=n.lane%2===0?'#4d96ff':'#ff6b6b';
      ctx.beginPath(); ctx.arc(x,n.y,8,0,Math.PI*2); ctx.fill();
    }
    // Update scores
    $('s1').textContent=p1.score;
    $('s2').textContent=p2.score;
    $('c1').textContent='COMBO '+p1.combo;
    $('c2').textContent='COMBO '+p2.combo;
  }else{
    ctx.fillStyle='#080818'; ctx.fillRect(0,0,W,H);
  }
  animId=requestAnimationFrame(loop);
}
resize(); setupTZ(); loop();

// ===== Button events =====
$('createBtn').addEventListener('click',()=>{ createRoom(); });
$('joinBtn').addEventListener('click',()=>{ joinRoom(); });
$('copyBtn').addEventListener('click',()=>{
  const ta=$('codeText');
  ta.select(); ta.setSelectionRange(0,99999);
  try{ document.execCommand('copy'); }catch(e){}
  $('copyBtn').textContent='✅ 已复制';
  if(isHost){
    stepShow(2);
    hint('📥 好友发回了回应码？粘贴到输入框');
    $('roomInput').value=''; $('roomInput').placeholder='粘贴好友的回应码';
    $('confirmBtn').style.display='';
    $('confirmBtn').textContent='✅ 确认连接';
  }else{
    stepShow(2);
    hint('✅ 回应码已发送，等待连接...');
  }
  setTimeout(()=>{ $('copyBtn').textContent='📋 复制'; },3000);
});
$('confirmBtn').addEventListener('click',()=>{ confirmAnswer(); });
$('diffGroup').querySelectorAll('.diff-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    $('diffGroup').querySelectorAll('.diff-btn').forEach(x=>x.classList.remove('act'));
    b.classList.add('act'); diff=b.dataset.d;
    status('难度: '+({easy:'🌱简单',normal:'🔥普通',hard:'💀困难'})[diff]);
  });
});
$('resReplay').addEventListener('click',()=>{
  $('resultPanel').classList.remove('show');
  if(dc&&dc.readyState==='open'){
    seed=Math.floor(Math.random()*999999)+1;
    dc.send(JSON.stringify({type:'start',seed,diff}));
    initGame();
  }
});
$('resMenu').addEventListener('click',()=>{
  $('resultPanel').classList.remove('show');
  $('gameArea').classList.remove('show');
  $('lobby').classList.remove('hidden');
  $('codeArea').classList.remove('show');
  $('roomInput').value=''; $('roomInput').placeholder='房间号 / 粘贴码';
