<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 双人坦克大战 - 衣碳未来</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    font-family: 'Segoe UI', sans-serif; 
    background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%);
    display: flex; justify-content: center; align-items: center; 
    min-height: 100vh; overflow: hidden;
    color: #fff;
}
.game-wrapper {
    text-align: center;
    position: relative;
}
.game-title {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 10px; text-shadow: none;
    letter-spacing: 2px;
}
.controls-info {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #aaa; margin-bottom: 8px;
    padding: 0 10px;
}
.controls-info .p1 { color: #4d96ff; text-align: left; }
.controls-info .p2 { color: #ff6b6b; text-align: right; }
canvas {
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    background: #111128;
    display: block;
    margin: 0 auto;
    box-shadow: 0 0 40px rgba(77, 150, 255, 0.1);
    width: 800px; height: 600px;
}
.score-board {
    display: flex; justify-content: space-between;
    align-items: center; margin: 10px auto 5px;
    max-width: 800px; font-size: 18px;
}
.score-board .p1-score { color: #4d96ff; }
.score-board .p2-score { color: #ff6b6b; }
.score-board .vs { color: #555; font-size: 14px; }
.status-bar {
    display: flex; justify-content: space-between;
    max-width: 800px; margin: 0 auto; font-size: 13px;
    color: #888;
}
.health-bar-container {
    display: flex; align-items: center; gap: 8px;
}
.health-bar {
    width: 120px; height: 6px; background: #333; border-radius: 3px; overflow: hidden;
}
.health-bar .fill-p1 { height: 100%; background: linear-gradient(90deg, #4d96ff, #6bcb77); border-radius: 3px; transition: width 0.2s; }
.health-bar .fill-p2 { height: 100%; background: linear-gradient(90deg, #ff6b6b, #ffd93d); border-radius: 3px; transition: width 0.2s; }
.overlay {
    position: absolute; top: 60px; left: 0; right: 0; bottom: 50px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: rgba(0,0,0,0.7); border-radius: 12px; z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.overlay.show { opacity: 1; pointer-events: all; }
.overlay h1 { font-size: 48px; margin-bottom: 10px; }
.overlay h2 { font-size: 20px; color: #aaa; font-weight: 400; margin-bottom: 20px; }
.btn {
    padding: 12px 40px; font-size: 18px; border: none; border-radius: 30px;
    cursor: pointer; font-weight: 700; transition: transform 0.2s;
    background: linear-gradient(135deg, #ffd93d, #ff6b6b); color: #1a1a3a;
}
.btn:hover { transform: scale(1.05); }
.btn:active { transform: scale(0.95); }
.mobile-controls {
    display: none;
    margin-top: 10px; gap: 20px; justify-content: center;
}
.mobile-controls .col { display: flex; flex-direction: column; align-items: center; }
.mobile-controls button {
    width: 60px; height: 60px; border-radius: 50%; border: none;
    font-size: 24px; background: rgba(255,255,255,0.1);
    color: #fff; cursor: pointer; margin: 3px;
    -webkit-tap-highlight-color: transparent; user-select: none;
}
.mobile-controls button:active { background: rgba(255,255,255,0.3); }
.mobile-controls .row { display: flex; }
@media (max-width: 820px) {
    canvas { width: 100vw; height: 75vw; max-height: 600px; }
    .game-title { font-size: 20px; }
    .controls-info { font-size: 11px; }
    .mobile-controls { display: flex; }
}
@media (max-width: 500px) {
    .health-bar { width: 80px; }
    .overlay h1 { font-size: 32px; }
}
</style>
</head>
<body>

<div class="game-wrapper" id="gameWrapper">
    <div class="game-title">🎯 双人坦克大战</div>
    <div class="controls-info">
        <div class="p1">🟦 P1: WASD移动 | Q射击</div>
        <div class="p2">🟥 P2: ↑↓←→移动 | /射击</div>
    </div>
    <div class="score-board">
        <span class="p1-score">P1 🔵 0</span>
        <span class="vs">⚔️ ROUND <span id="roundNum">1</span></span>
        <span class="p2-score">🔴 P2 0</span>
    </div>
    <div class="status-bar">
        <div class="health-bar-container">
            <span style="color:#4d96ff">❤️</span>
            <div class="health-bar"><div class="fill-p1" id="healthP1" style="width:100%"></div></div>
        </div>
        <span id="timerDisplay" style="color:#ffd93d">⏱️ 0s</span>
        <div class="health-bar-container">
            <div class="health-bar"><div class="fill-p2" id="healthP2" style="width:100%"></div></div>
            <span style="color:#ff6b6b">❤️</span>
        </div>
    </div>
    <div style="position:relative; display:inline-block;">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="overlay" id="overlay">
            <h1 id="overlayTitle">🎮 坦克大战</h1>
            <h2 id="overlaySub">准备开始！</h2>
            <button class="btn" id="restartBtn">🔫 开始游戏</button>
        </div>
    </div>
    <div class="mobile-controls" id="mobileControls">
        <div class="col">
            <span style="color:#4d96ff;font-size:12px;margin-bottom:4px;">P1</span>
            <div class="row">
                <button data-p1="w">⬆</button>
            </div>
            <div class="row">
                <button data-p1="a">⬅</button>
                <button data-p1="s">⬇</button>
                <button data-p1="d">➡</button>
            </div>
            <button data-p1="q" style="width:80px;border-radius:12px;margin-top:4px;font-size:14px;">💥射击</button>
        </div>
        <div class="col">
            <span style="color:#ff6b6b;font-size:12px;margin-bottom:4px;">P2</span>
            <div class="row">
                <button data-p2="up">⬆</button>
            </div>
            <div class="row">
                <button data-p2="left">⬅</button>
                <button data-p2="down">⬇</button>
                <button data-p2="right">➡</button>
            </div>
            <button data-p2="slash" style="width:80px;border-radius:12px;margin-top:4px;font-size:14px;">💥射击</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;

// DOM refs
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlaySub = document.getElementById('overlaySub');
const restartBtn = document.getElementById('restartBtn');
const roundNum = document.getElementById('roundNum');
const healthP1 = document.getElementById('healthP1');
const healthP2 = document.getElementById('healthP2');
const timerDisplay = document.getElementById('timerDisplay');

// Game state
const game = {
    p1Score: 0,
    p2Score: 0,
    round: 1,
    state: 'menu', // menu, playing, paused, roundEnd, gameOver
    timer: 0,
    maxHealth: 100,
};

// Tanks
class Tank {
    constructor(x, y, color, name, facing) {
        this.x = x; this.y = y;
        this.color = color; this.name = name;
        this.size = 30;
        this.speed = 3;
        this.health = game.maxHealth;
        this.facing = facing || 0; // radians
        this.bullets = [];
        this.cooldown = 0;
        this.maxCooldown = 20;
        this.alive = true;
        this.baseColor = color;
        this.hitFlash = 0;
    }
    
    draw() {
        if (!this.alive) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.facing);
        
        // Flash on hit
        const mainColor = this.hitFlash > 0 ? '#fff' : this.color;
        if (this.hitFlash > 0) this.hitFlash--;
        
        // Tank body
        ctx.fillStyle = mainColor;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        // Body
        ctx.fillRect(-14, -10, 28, 20);
        ctx.shadowBlur = 0;
        
        // Treads
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(-17, -12, 6, 24);
        ctx.fillRect(11, -12, 6, 24);
        
        // Turret
        ctx.fillStyle = mainColor;
        ctx.fillRect(-4, -16, 8, 20);
        
        // Barrel
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(-3, -26, 6, 14);
        
        // Top detail
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.arc(0, -4, 6, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
        
        // Draw bullets
        this.bullets.forEach(b => b.draw());
    }
    
    update() {
        if (!this.alive) return;
        if (this.cooldown > 0) this.cooldown--;
        
        // Update bullets
        this.bullets.forEach(b => b.update());
        this.bullets = this.bullets.filter(b => b.active);
    }
    
    shoot() {
        if (this.cooldown > 0 || !this.alive) return false;
        this.cooldown = this.maxCooldown;
        const bx = this.x + Math.cos(this.facing) * 20;
        const by = this.y + Math.sin(this.facing) * 20;
        this.bullets.push(new Bullet(bx, by, this.facing, this));
        return true;
    }
    
    takeDamage(dmg) {
        this.health -= dmg;
        this.hitFlash = 10;
        if (this.health <= 0) {
            this.health = 0;
            this.alive = false;
        }
    }
    
    move(dx, dy, obstacles) {
        const newX = this.x + dx;
        const newY = this.y + dy;
        
        // Boundary check
        if (newX < 20 || newX > W - 20 || newY < 20 || newY > H - 20) return;
        
        // Obstacle collision
        for (const obs of obstacles) {
            if (Math.abs(newX - obs.x) < (this.size/2 + obs.size/2) &&
                Math.abs(newY - obs.y) < (this.size/2 + obs.size/2)) {
                return;
            }
        }
        
        // Tank collision
        const otherTank = game.tanks.find(t => t !== this && t.alive);
        if (otherTank && otherTank.alive) {
            if (Math.abs(newX - otherTank.x) < this.size - 2 &&
                Math.abs(newY - otherTank.y) < this.size - 2) {
                return;
            }
        }
        
        this.x = newX;
        this.y = newY;
    }
}

class Bullet {
    constructor(x, y, angle, owner) {
        this.x = x; this.y = y;
        this.speed = 7;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.owner = owner;
        this.active = true;
        this.radius = 5;
        this.trail = [];
    }
    
    draw() {
        // Trail
        for (let i = 0; i < this.trail.length; i++) {
            const alpha = (i / this.trail.length) * 0.5;
            ctx.beginPath();
            ctx.arc(this.trail[i].x, this.trail[i].y, this.radius * (i/this.trail.length), 0, Math.PI*2);
            ctx.fillStyle = `rgba(255, 200, 50, ${alpha})`;
            ctx.fill();
        }
        
        // Bullet
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
        ctx.fillStyle = '#ffd93d';
        ctx.shadowColor = '#ffd93d';
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Core
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
    }
    
    update() {
        // Store trail
        this.trail.push({x: this.x, y: this.y});
        if (this.trail.length > 5) this.trail.shift();
        
        this.x += this.vx;
        this.y += this.vy;
        
        // Boundary check
        if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) {
            this.active = false;
            createExplosion(this.x, this.y, '#ffd93d', 10);
            return;
        }
        
        // Hit obstacles
        for (const obs of game.obstacles) {
            if (Math.abs(this.x - obs.x) < obs.size/2 + this.radius &&
                Math.abs(this.y - obs.y) < obs.size/2 + this.radius) {
                this.active = false;
                createExplosion(this.x, this.y, '#ff8855', 15);
                obs.health--;
                if (obs.health <= 0) {
                    obs.destroyed = true;
                    createExplosion(obs.x, obs.y, '#ff6644', 30);
                }
                return;
            }
        }
        
        // Hit other tank
        const otherTank = game.tanks.find(t => t !== this.owner && t.alive);
        if (otherTank && otherTank.alive) {
            if (Math.abs(this.x - otherTank.x) < otherTank.size/2 + this.radius &&
                Math.abs(this.y - otherTank.y) < otherTank.size/2 + this.radius) {
                this.active = false;
                otherTank.takeDamage(25);
                createExplosion(this.x, this.y, '#ff4444', 20);
                return;
            }
        }
        
        // Hit owner? No friendly fire
    }
}

// Explosion effects
const explosions = [];
function createExplosion(x, y, color, size) {
    for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        explosions.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 20 + Math.random() * 15,
            maxLife: 35,
            color: color,
            size: Math.random() * size * 0.4 + size * 0.2,
        });
    }
}

function drawExplosions() {
    for (let i = explosions.length - 1; i >= 0; i--) {
        const e = explosions[i];
        e.x += e.vx;
        e.y += e.vy;
        e.vx *= 0.95;
        e.vy *= 0.95;
        e.life--;
        
        const alpha = e.life / e.maxLife;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size * alpha, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${hexToRgb(e.color)}, ${alpha})`;
        ctx.fill();
        
        if (e.life <= 0) {
            explosions.splice(i, 1);
        }
    }
}

function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `${r},${g},${b}`;
}

// Obstacles
function createObstacles() {
    const positions = [
        {x: 200, y: 150}, {x: 600, y: 150},
        {x: 200, y: 450}, {x: 600, y: 450},
        {x: 400, y: 100}, {x: 400, y: 500},
        {x: 100, y: 300}, {x: 700, y: 300},
        {x: 300, y: 250}, {x: 500, y: 350},
        {x: 300, y: 350}, {x: 500, y: 250},
        {x: 400, y: 300},
    ];
    return positions.map(p => ({
        x: p.x, y: p.y,
        size: 30,
        health: 3,
        destroyed: false,
        color: Math.random() > 0.5 ? '#4a4a8a' : '#5a3a7a',
    }));
}

// Init game
function initGame() {
    game.tanks = [
        new Tank(100, 300, '#4d96ff', 'P1', Math.PI * 1.5),
        new Tank(700, 300, '#ff6b6b', 'P2', Math.PI * 0.5),
    ];
    game.obstacles = createObstacles();
    game.timer = 0;
    game.state = 'playing';
    explosions.length = 0;
    
    // Reset tank healths
    game.tanks.forEach(t => {
        t.health = game.maxHealth;
        t.alive = true;
        t.bullets = [];
        t.cooldown = 0;
    });
    
    overlay.classList.remove('show');
}

function checkRoundEnd() {
    const alive = game.tanks.filter(t => t.alive);
    if (alive.length === 1 && game.state === 'playing') {
        game.state = 'roundEnd';
        const winner = alive[0];
        if (winner.name === 'P1') {
            game.p1Score++;
        } else {
            game.p2Score++;
        }
        
        setTimeout(() => {
            if (game.p1Score >= 3 || game.p2Score >= 3) {
                game.state = 'gameOver';
                const champ = game.p1Score >= 3 ? '🔵 P1' : '🔴 P2';
                overlayTitle.textContent = `🏆 ${champ} 获胜！`;
                overlaySub.textContent = `最终比分 ${game.p1Score} : ${game.p2Score}`;
                restartBtn.textContent = '🔄 再来一局';
                overlay.classList.add('show');
            } else {
                game.round++;
                overlayTitle.textContent = `⚔️ 第 ${game.round} 回合`;
                overlaySub.textContent = `P1 ${game.p1Score} : ${game.p2Score} P2`;
                restartBtn.textContent = '▶️ 继续';
                overlay.classList.add('show');
            }
            updateUI();
        }, 800);
    }
}

function updateUI() {
    roundNum.textContent = game.round;
    document.querySelector('.p1-score').textContent = `P1 🔵 ${game.p1Score}`;
    document.querySelector('.p2-score').textContent = `🔴 P2 ${game.p2Score}`;
    
    const p1 = game.tanks[0];
    const p2 = game.tanks[1];
    healthP1.style.width = `${(p1.health / game.maxHealth) * 100}%`;
    healthP2.style.width = `${(p2.health / game.maxHealth) * 100}%`;
    timerDisplay.textContent = `⏱️ ${Math.floor(game.timer / 60)}s`;
}

// Input
const keys = {};
document.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    e.preventDefault();
});
document.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    e.preventDefault();
});

// Mobile controls
document.querySelectorAll('.mobile-controls button').forEach(btn => {
    const handler = (e) => {
        e.preventDefault();
        const key = btn.dataset.p1 || btn.dataset.p2;
        if (e.type === 'touchstart' || e.type === 'mousedown') {
            keys[key] = true;
        } else {
            keys[key] = false;
        }
    };
    btn.addEventListener('touchstart', handler, {passive: false});
    btn.addEventListener('touchend', () => {
        const key = btn.dataset.p1 || btn.dataset.p2;
        keys[key] = false;
    }, {passive: false});
    btn.addEventListener('mousedown', handler);
    btn.addEventListener('mouseup', () => {
        const key = btn.dataset.p1 || btn.dataset.p2;
        keys[key] = false;
    });
});

// Restart button
restartBtn.addEventListener('click', () => {
    if (game.state === 'gameOver') {
        game.p1Score = 0;
        game.p2Score = 0;
        game.round = 1;
        game.state = 'menu';
        overlayTitle.textContent = '🎮 坦克大战';
        overlaySub.textContent = '准备开始！';
        restartBtn.textContent = '🔫 开始游戏';
    }
    initGame();
    updateUI();
});

// Input processing
function processInput() {
    if (game.state !== 'playing') return;
    
    const p1 = game.tanks[0];
    const p2 = game.tanks[1];
    
    // P1: WASD + Q
    let dx = 0, dy = 0;
    if (keys['w']) dy -= p1.speed;
    if (keys['s']) dy += p1.speed;
    if (keys['a']) dx -= p1.speed;
    if (keys['d']) dx += p1.speed;
    if (dx !== 0 || dy !== 0) {
        p1.facing = Math.atan2(dy, dx);
        p1.move(dx, dy, game.obstacles.filter(o => !o.destroyed));
    }
    if (keys['q']) p1.shoot();
    
    // P2: Arrow keys + /
    dx = 0; dy = 0;
    if (keys['arrowup']) dy -= p2.speed;
    if (keys['arrowdown']) dy += p2.speed;
    if (keys['arrowleft']) dx -= p2.speed;
    if (keys['arrowright']) dx += p2.speed;
    if (dx !== 0 || dy !== 0) {
        p2.facing = Math.atan2(dy, dx);
        p2.move(dx, dy, game.obstacles.filter(o => !o.destroyed));
    }
    if (keys['/']) p2.shoot();
}

// Draw grid
function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
}

// Draw obstacles
function drawObstacles() {
    game.obstacles.forEach(o => {
        if (o.destroyed) return;
        
        // Glow
        ctx.shadowColor = o.color;
        ctx.shadowBlur = 10;
        
        // Block
        ctx.fillStyle = o.color;
        const half = o.size / 2;
        ctx.fillRect(o.x - half, o.y - half, o.size, o.size);
        ctx.shadowBlur = 0;
        
        // Border
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 1;
        ctx.strokeRect(o.x - half, o.y - half, o.size, o.size);
        
        // Health indicator
        if (o.health < 3) {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            const w = (o.health / 3) * o.size;
            ctx.fillRect(o.x - half, o.y + half - 3, w, 3);
        }
    });
}

// Draw arena border glow
function drawBorder() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(77,150,255,0.05)');
    grad.addColorStop(0.5, 'rgba(255,107,107,0.05)');
    grad.addColorStop(1, 'rgba(77,150,255,0.05)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
}

// Main loop
function gameLoop() {
    // Clear
    ctx.clearRect(0, 0, W, H);
    
    // Background
    ctx.fillStyle = '#0d0d24';
    ctx.fillRect(0, 0, W, H);
    
    drawGrid();
    drawBorder();
    drawObstacles();
    
    if (game.state === 'playing' || game.state === 'roundEnd') {
        game.timer++;
        processInput();
        
        game.tanks.forEach(t => {
            t.update();
            t.draw();
        });
        
        drawExplosions();
        checkRoundEnd();
        updateUI();
    } else if (game.state === 'menu') {
        // Draw tanks in menu
        game.tanks.forEach(t => {
            t.draw();
        });
    }
    
    requestAnimationFrame(gameLoop);
}

// Start
initGame();
game.state = 'menu';
overlay.classList.add('show');
gameLoop();
</script>
</body>
</html>
